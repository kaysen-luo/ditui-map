<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FF6A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地推标点 · 在线版</title>
<style>
:root{
  --pri:#FF6A3D;--pri-d:#E8552A;--pri-s:#FFF1EC;
  --ink:#1F2329;--ink2:#4E5969;--ink3:#86909C;--line:#E5E6EB;--bg:#F5F6F7;--card:#fff;
  --r:12px;--sh:0 4px 16px rgba(31,35,41,.12);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
[hidden]{display:none!important}

/* ---------- 地图与浮层 ---------- */
#map{position:fixed;inset:0;background:#E8ECEF}
.topbar{position:fixed;top:calc(12px + var(--sat));left:16px;right:16px;display:flex;gap:8px;z-index:20}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:48px;padding:0 8px 0 16px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.q-clear{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--ink3);display:grid;place-items:center}
.icon-btn{width:48px;height:48px;flex:none;border:0;border-radius:var(--r);background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink2)}
.icon-btn:active{background:var(--bg)}

.results{position:fixed;top:calc(68px + var(--sat));left:16px;right:16px;max-height:55vh;overflow:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh);z-index:21}
.res-group{padding:8px 16px 4px;font-size:12px;color:var(--ink3);background:#FAFAFB}
.res-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.res-item:last-child{border-bottom:0}
.res-item:active{background:var(--bg)}
.res-main{flex:1;min-width:0}
.res-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-main small{display:block;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-btn{flex:none;height:32px;padding:0 12px;border:1px solid var(--pri);border-radius:999px;background:var(--pri-s);color:var(--pri);font-size:13px;font-weight:600}
.res-empty{padding:24px 16px;text-align:center;color:var(--ink3)}

.side-ctrls{position:fixed;right:16px;bottom:calc(88px + var(--sab));display:flex;flex-direction:column;gap:8px;z-index:10}
.bottombar{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--sab));display:flex;gap:8px;z-index:20}
.bottombar .btn.pri{flex:1}
#pickBar{display:none}

.btn{height:48px;padding:0 16px;border:0;border-radius:var(--r);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:active{background:var(--pri-d)}
.btn.pri:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:#E5484D;border:1px solid #F7C6C7}
.btn b{color:var(--pri)}

/* 选点模式 */
.pick-pin{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-100%);z-index:15;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.pick-hint{display:none;position:fixed;top:calc(16px + var(--sat));left:50%;transform:translateX(-50%);z-index:20;padding:8px 16px;border-radius:999px;background:rgba(31,35,41,.85);color:#fff;font-size:14px;white-space:nowrap}
body.picking .pick-pin,body.picking .pick-hint{display:block}
body.picking #pickBar{display:flex}
body.picking #mainBar,body.picking .topbar,body.picking .results{display:none!important}

/* ---------- 地图标点 ---------- */
.mk{display:flex;flex-direction:column;align-items:center;cursor:pointer}
/* 圈区域 / 选点时标点不拦截点击，点击穿透到地图 */
body.drawing .mk,body.picking .mk,body.drawing .amap-marker,body.picking .amap-marker{pointer-events:none}
.mk-card{display:flex;align-items:center;gap:6px;max-width:168px;padding:3px 10px 3px 3px;background:#fff;border:2px solid var(--c);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.mk-card img,.mk-noimg{width:36px;height:36px;flex:none;border-radius:7px;object-fit:cover;background:var(--bg);display:grid;place-items:center;color:var(--ink3)}
.mk-card b{font-size:12px;line-height:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-tail{width:2px;height:8px;background:var(--c)}
.mk-dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.z-far .mk-card img,body.z-far .mk-noimg{display:none}
body.z-far .mk-card{padding:2px 8px}
body.z-vfar .mk-card,body.z-vfar .mk-tail{display:none}

/* ---------- 未配置 Key 的引导卡 ---------- */
.setup{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:400px;margin:0 auto;padding:24px;background:#fff;border-radius:16px;box-shadow:var(--sh);z-index:30}
.setup h2{margin:0 0 8px;font-size:18px}
.setup p{margin:0 0 16px;color:var(--ink2)}
.setup ol{margin:0 0 16px;padding-left:20px;color:var(--ink2)}
.setup ol li{margin-bottom:4px}
.setup a{color:var(--pri)}
.setup .btn{width:100%}
.setup .err{padding:8px 12px;margin-bottom:16px;border-radius:8px;background:#FFF0F0;color:#C62828;font-size:13px}

/* ---------- 底部抽屉（桌面端为右侧面板） ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:#fff;border-radius:16px 16px 0 0;z-index:41;
  transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
body.sheet-open .backdrop{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sheet-handle{width:40px;height:4px;margin:8px auto 0;border-radius:2px;background:var(--line);flex:none}
#sheetBody{flex:1;overflow:auto;padding:0 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheetBody::after{content:'';display:block;height:calc(16px + var(--sab))}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px;background:#fff}
.sheet-head h2{margin:0;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--bg);color:var(--ink2);display:grid;place-items:center}
@media (min-width:768px){
  .topbar{right:auto;width:440px}
  .results{right:auto;width:440px}
  .bottombar{right:auto;width:440px}
  .sheet{left:auto;top:0;width:420px;max-height:none;border-radius:0;transform:translateX(105%);box-shadow:-8px 0 24px rgba(0,0,0,.12)}
  .sheet-handle{display:none}
  .backdrop{background:transparent}
}

/* ---------- 表单 ---------- */
.field{display:block;margin:16px 0}
.field>span{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.field>span small{font-weight:400;color:var(--ink3)}
.field em{color:var(--pri);font-style:normal}
.input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px;outline:0}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--pri)}
.input.bad{border-color:#E5484D}
.loc{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:8px;background:var(--bg)}
.loc svg{color:var(--pri);margin-top:12px}
.loc-main{flex:1;min-width:0}
.loc-main .input{height:40px;background:#fff}
.loc-main small{display:block;margin-top:4px;color:var(--ink3);font-size:12px}
.link{border:0;background:none;color:var(--pri);font-size:13px;font-weight:600;padding:12px 0 0;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-opt{display:block;padding:8px 4px;border:1.5px solid var(--line);border-radius:8px;text-align:center;cursor:pointer;background:#fff}
.seg-opt input{display:none}
.seg-opt b{display:block;font-size:15px}
.seg-opt small{display:block;font-size:11px;color:var(--ink3);line-height:1.4}
.seg-opt.on{border-color:var(--c);background:var(--cs)}
.seg-opt.on b{color:var(--c)}
.seg.bad .seg-opt{border-color:#F7C6C7}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;padding:0}
.ph .cover{position:absolute;left:4px;bottom:4px;padding:0 6px;border-radius:4px;background:var(--pri);color:#fff;font-size:11px;line-height:18px}
.ph-add{border:1.5px dashed #C9CDD4;background:#FAFAFB;color:var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;width:100%;padding:0}
.form-actions{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + var(--sab));background:#fff;z-index:2}
.form-actions .btn{flex:1}
.form-actions .btn.pri{flex:2}

/* ---------- 详情 ---------- */
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -16px 0;padding:0 16px}
.gallery img{height:200px;max-width:85%;flex:none;border-radius:8px;object-fit:cover;scroll-snap-align:start;cursor:zoom-in}
.no-photo{height:120px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink3)}
.badge{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;line-height:20px;font-weight:600;color:var(--c);background:var(--cs);white-space:nowrap}
.kv{margin:16px 0;border-top:1px solid var(--line)}
.kv div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{width:64px;flex:none;color:var(--ink3)}
.kv dd{margin:0;flex:1;min-width:0;word-break:break-all}
.kv a{color:var(--pri);text-decoration:none;font-weight:600}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.actions .btn{font-size:15px;padding:0 8px}

/* ---------- 记录列表 ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.fchip{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;white-space:nowrap}
.fchip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:active{background:var(--bg)}
.li img,.li .noimg{width:56px;height:56px;flex:none;border-radius:8px;object-fit:cover;background:var(--bg);display:grid;place-items:center;color:var(--ink3)}
.li-main{flex:1;min-width:0}
.li-top{display:flex;align-items:center;gap:8px}
.li-top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.li-main small{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--ink3)}
.list-foot{position:sticky;bottom:0;padding:12px 0 calc(12px + var(--sab));background:#fff;z-index:2}
.list-foot .row{display:flex;gap:8px}
.list-foot .btn{flex:1}
.tip{margin:8px 0 0;font-size:12px;color:var(--ink3);text-align:center}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);padding:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- 设置 ---------- */
.help{font-size:12px;color:var(--ink3);margin-top:4px}
.help a{color:var(--pri)}

/* ---------- 吐司 / 看图 / 加载 ---------- */
.toast{position:fixed;left:50%;top:calc(76px + var(--sat));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:10px 16px;border-radius:8px;background:rgba(31,35,41,.9);color:#fff;font-size:14px;z-index:60;text-align:center}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.busy{position:fixed;inset:0;z-index:65;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.busy div{padding:16px 24px;border-radius:12px;background:#fff;box-shadow:var(--sh);font-weight:600}

/* ---------- 待核实标点 ---------- */
.mk.pending .mk-card{border-style:dashed;background:#FFFBF2;padding:3px 4px 3px 8px;max-width:150px}
.mk.pending .mk-noimg{background:#FFF1D6;color:#B76E00}
.mk-tag{flex:none;padding:0 4px;border-radius:4px;background:#F5A524;color:#fff;font-size:10px;line-height:16px;font-weight:600}
body.z-far .mk-tag{display:none}
/* 待核实往往成批出现，17 级以下只显示圆点，避免卡片叠成一片 */
body.z-mid .mk.pending .mk-card,body.z-mid .mk.pending .mk-tail{display:none}
body.z-mid .mk.pending .mk-dot{width:10px;height:10px;border-width:1.5px}
.badge.pend{--c:#B76E00;--cs:#FFF1D6}
.bottombar .btn.task b{color:#B76E00}

/* ---------- 圈区域模式 ---------- */
#drawBar{display:none}
body.drawing #drawBar{display:flex}
body.drawing #mainBar,body.drawing .topbar,body.drawing .results,body.drawing .side-ctrls{display:none!important}
body.drawing .draw-hint{display:block}
.draw-hint{display:none;position:fixed;top:calc(16px + var(--sat));left:50%;transform:translateX(-50%);z-index:20;padding:8px 16px;border-radius:999px;background:rgba(31,35,41,.85);color:#fff;font-size:14px;white-space:nowrap}
.vx{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* ---------- 区域 / 任务列表 ---------- */
.area{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.area-ico{width:40px;height:40px;flex:none;border-radius:8px;background:var(--pri-s);color:var(--pri);display:grid;place-items:center}
.area-main{flex:1;min-width:0}
.area-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area-main small{display:block;color:var(--ink3);font-size:12px}
.mini{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;white-space:nowrap}
.mini.pri{border-color:var(--pri);background:var(--pri-s);color:var(--pri);font-weight:600}
.mini.danger{color:#E5484D;border-color:#F7C6C7}
.prog{height:4px;margin-top:6px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:#12A150}
.dist{flex:none;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.dist.near{color:#12A150}

/* 区域内搜索结果勾选 */
.types{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.srow{display:flex;gap:8px}
.srow .input{flex:1}
.pick-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px;font-size:13px;color:var(--ink2)}
.pick-head .ops{display:flex;gap:8px}
.ck{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ck input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--pri)}
.ck.dis{opacity:.45;cursor:default}
.ck-main{flex:1;min-width:0}
.ck-main b{display:block;font-weight:600}
.ck-main small{display:block;color:var(--ink3);font-size:12px}

/* 核实提示条 */
.banner{display:flex;gap:8px;align-items:center;margin:4px 0 8px;padding:10px 12px;border-radius:8px;font-size:13px}
.banner.ok{background:#E8F7EE;color:#0E7A3D}
.banner.warn{background:#FFF1D6;color:#8A5300}
.banner.err{background:#FDECEC;color:#B42318}

/* ---------- 在线版：登录 / 同步状态 / 角色 ---------- */
body:not(.is-admin) .admin-only{display:none!important}
.login{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:var(--bg)}
.login form{width:100%;max-width:360px;padding:24px;background:#fff;border-radius:16px;box-shadow:var(--sh)}
.login h2{margin:0 0 4px;font-size:22px}
.login p{margin:0 0 16px;color:var(--ink3);font-size:13px}
.login .btn{width:100%;margin-top:8px}
.login .err{margin-bottom:12px;padding:10px 12px;border-radius:8px;background:#FDECEC;color:#B42318;font-size:13px}
.sync-chip{position:fixed;left:16px;top:calc(68px + var(--sat));z-index:19;height:28px;padding:0 10px;border:0;border-radius:999px;background:#fff;color:var(--ink2);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.sync-chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#12A150)}
body.picking .sync-chip,body.drawing .sync-chip{display:none}
.acct{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px;border-radius:var(--r);background:var(--bg)}
.acct .av{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.acct b{display:block}
.acct small{color:var(--ink3)}
.ph-load{display:grid;place-items:center;color:var(--ink3);font-size:12px;background:var(--bg)}
</style>
</head>
<body>
<div id="map"></div>

<!-- 选点模式中心针 -->
<svg class="pick-pin" width="40" height="52" viewBox="0 0 40 52" aria-hidden="true">
  <path d="M20 0C9 0 0 9 0 20c0 14 20 32 20 32s20-18 20-32C40 9 31 0 20 0z" fill="#FF6A3D"/>
  <circle cx="20" cy="20" r="8" fill="#fff"/>
</svg>
<div class="pick-hint">拖动地图，让针尖对准店铺门口</div>

<header class="topbar">
  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜索成都的店铺、地址" autocomplete="off" enterkeyhint="search">
    <button class="q-clear" id="qClear" aria-label="清空" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;

function inPolygon(p, path) {

  for (let i = 0, j = path.length - 1; i < path.length; j = i++) {
    const [xi, yi] = path[i], [xj, yj] = path[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) inside = !inside;

/* ==================== 数据层：本地缓存 + 上传队列 + Supabase ====================
 * 和单机版保持同样的 DB.shops / DB.areas 接口，业务代码基本不用改：
 *   - 写入：先存本机 IndexedDB 并进「待上传」队列，有网时由 Sync 按顺序传到 Supabase
 *   - 删除：软删除（deleted=true），这样其他人增量同步时也能收到
 *   - 照片：记录里只存 Storage 路径；照片本身缓存在本机 blobs 表，按需下载 */
const LDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ditui-pin-online', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      db.createObjectStore('shops', { keyPath: 'id' });
      db.createObjectStore('areas', { keyPath: 'id' });
      db.createObjectStore('queue', { keyPath: 'k' });   // 待上传操作，同一条记录只留最新一次
      db.createObjectStore('blobs');                    // 照片缓存：Storage 路径 -> Blob
      db.createObjectStore('meta');                     // 同步游标、账号缓存等
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (names, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(names, mode);
      const out = fn(n => t.objectStore(n));
      const reqs = [].concat(out || []);
      t.oncomplete = () => res(reqs.length === 1 ? reqs[0].result : reqs.map(q => q.result));
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('写入被中止（可能是存储空间不足）'));
    });
  };
  return {
    run,
    all: name => run(name, 'readonly', st => st(name).getAll()),
    get: (name, key) => run(name, 'readonly', st => st(name).get(key)),
    put: (name, val, key) => run(name, 'readwrite', st => key === undefined ? st(name).put(val) : st(name).put(val, key)),
    del: (name, key) => run(name, 'readwrite', st => st(name).delete(key)),
    clearAll: () => run(['shops', 'areas', 'queue', 'blobs', 'meta'], 'readwrite', st => ['shops', 'areas', 'queue', 'blobs', 'meta'].map(n => st(n).clear())),
  };
})();

// 照片 Blob <-> Storage 路径：编辑已有记录时，没换的照片不重复上传
const blobPath = new WeakMap();
const PHOTO_BUCKET = 'photos';
async function getPhotoBlob(path) {
  let b = await LDB.get('blobs', path).catch(() => null);
  if (!b) {
    if (!sb) throw new Error('未连接服务器');
    const { data, error } = await sb.storage.from(PHOTO_BUCKET).download(path);
    if (error || !data) throw new Error('照片下载失败' + (navigator.onLine ? '' : '（离线）'));
    b = data.type ? data : new Blob([data], { type: 'image/jpeg' });
    LDB.put('blobs', b, path).catch(() => {});
  }
  blobPath.set(b, path);
  return b;
}
async function getPhotoBlobs(paths) {
  const out = [];
  for (const p of paths || []) { try { out.push(await getPhotoBlob(p)); } catch {} }
  return out;
}

// 本地记录（驼峰）<-> 数据库行（下划线）
const SHOP_COLS = {
  id: 'id', status: 'status', name: 'name', phone: 'phone', scale: 'scale', note: 'note', address: 'address',
  lng: 'lng', lat: 'lat', photos: 'photos', thumb: 'thumb', recorder: 'recorder', planner: 'planner',
  areaId: 'area_id', poiId: 'poi_id', poiType: 'poi_type', verifiedAt: 'verified_at', verifyDist: 'verify_dist',
  verifyPos: 'verify_pos', deleted: 'deleted', createdAt: 'created_at', updatedAt: 'updated_at',
};
const AREA_COLS = { id: 'id', name: 'name', path: 'path', deleted: 'deleted', createdAt: 'created_at', updatedAt: 'updated_at' };
function toRow(rec, cols) {
  const row = {};
  for (const [k, c] of Object.entries(cols)) if (rec[k] !== undefined) row[c] = rec[k];
  return row;
}
function fromRow(row, cols) {
  const rec = {};
  for (const [k, c] of Object.entries(cols)) rec[k] = row[c];
  rec.owner = row.owner || ''; rec.serverAt = row.server_at || '';
  if (cols === SHOP_COLS) {
    rec.photos = rec.photos || []; rec.verifyDist = rec.verifyDist ?? null;
    ['phone', 'scale', 'note', 'address', 'thumb', 'recorder', 'planner', 'areaId', 'poiId', 'poiType'].forEach(k => { rec[k] = rec[k] || ''; });
  }
  return rec;
}

const DB = (() => {
  // 记录里的照片 Blob 换成 Storage 路径；新照片缓存到本机，等待上传
  async function photosToPaths(rec) {
    const paths = [], fresh = [];
    for (const p of rec.photos || []) {
      if (typeof p === 'string') { paths.push(p); continue; }
      let path = blobPath.get(p);
      if (!path) {
        path = `${rec.id}/${uid()}.jpg`;
        await LDB.put('blobs', p, path);
        blobPath.set(p, path);
        fresh.push(path);
      }
      paths.push(path);
    }
    rec.photos = paths;
    return fresh;
  }
  const table = (name, cols) => ({
    all: () => LDB.all(name),
    async put(rec) { await this.putMany([rec]); },
    async putMany(recs) {
      for (const rec of recs) {
        // 表单只带业务字段：补回归属人和服务器版本标记；核实后归核实人
        const prev = (name === 'shops' ? state.shops : state.areas).get(rec.id);
        if (rec.serverAt === undefined) rec.serverAt = (prev && prev.serverAt) || '';
        if (rec.owner === undefined) rec.owner = (prev && prev.owner) || state.me.id;
        if (prev && isPending(prev) && rec.status === 'verified') rec.owner = state.me.id;
        const files = name === 'shops' ? await photosToPaths(rec) : [];
        await Sync.enqueue(name, rec, files);
      }
    },
    async del(id) { await this.delMany([id]); },
    async delMany(ids) {
      for (const id of ids) {
        const cur = name === 'shops' ? state.shops.get(id) : state.areas.get(id);
        if (!cur) continue;
        await Sync.enqueue(name, { ...cur, deleted: true, updatedAt: Math.max(Date.now(), (cur.updatedAt || 0) + 1) }, []);
      }
    },
  });

/* ==================== 同步引擎 ====================
 * 队列：每条记录一个 key（shops:id），离线多次修改只保留最新一次；按先后顺序上传
 * 拉取：按 server_at 增量拉；实时推送只当「有变化」的提醒，收到后立即增量拉取 */
let sb = null;   // Supabase 客户端
const Sync = (() => {
  let busyFlag = false, again = false, timer = null, pullTimer = null, seq = Date.now();
  const st = { pending: 0, online: navigator.onLine, syncing: false, error: '', lastOk: 0, realtime: false };

  async function enqueue(table, rec, files) {
    const k = table + ':' + rec.id;
    const old = await LDB.get('queue', k);
    const isNew = old ? old.isNew : !rec.serverAt;   // 服务器上还没有这条
    const cleaned = { ...rec }; delete cleaned.serverAt;
    const item = {
      k, table, id: rec.id, isNew, seq: old ? old.seq : ++seq,
      rec: cleaned, files: [...new Set([...(old ? old.files : []), ...files])],
    };

    if (rec.deleted && isNew) {
      await LDB.run(['queue', table], 'readwrite', s => [s('queue').delete(k), s(table).delete(rec.id)]);
    } else {
      await LDB.run(['queue', table], 'readwrite', s => [s('queue').put(item), rec.deleted ? s(table).delete(rec.id) : s(table).put(rec)]);
    }
    await refreshCount();
    kick(300);
  }
  async function refreshCount() {
    try { st.pending = (await LDB.run('queue', 'readonly', s => s('queue').count())); } catch {}
    renderSyncChip();
  }
  function kick(ms = 0) { clearTimeout(timer); timer = setTimeout(run, ms); }

  // 网络类错误：保留队列稍后重试；其余（权限、校验）是被服务器拒绝
  const isNetErr = e => !e || !e.code || /fetch|network|timeout|Load failed/i.test(e.message || '');
  const isAuthErr = e => e && (e.code === 'PGRST301' || e.code === 'PGRST303' || /JWT/i.test(e.message || ''));

  async function uploadFiles(item) {
    for (const path of item.files) {
      const blob = await LDB.get('blobs', path);
      if (!blob) continue;
      const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (error && !/exists|Duplicate/i.test(error.message || '') && String(error.statusCode) !== '409') {
        throw Object.assign(new Error('照片上传失败：' + error.message), { net: true });
      }
    }
  }
  async function pushOne(item) {
    const cols = item.table === 'shops' ? SHOP_COLS : AREA_COLS;
    const row = toRow(item.rec, cols);
    row.created_by = state.me.id;
    if (item.files.length) await uploadFiles(item);
    let res;
    if (item.isNew) {
      res = await sb.from(item.table).insert(row).select();
      if (res.error && res.error.code === '23505') item.isNew = false;   // 已经传过了（上次没收到回应）
    }
    if (!item.isNew) {
      delete row.created_by;
      res = await sb.from(item.table).update(row).eq('id', item.id).select();
    }
    if (res.error) {
      if (isNetErr(res.error)) throw Object.assign(new Error(res.error.message), { net: true });
      if (isAuthErr(res.error)) throw Object.assign(new Error('登录已过期'), { auth: true });
      return { rejected: res.error.message };
    }
    if (!res.data || !res.data.length) return { rejected: '服务器上已有更新的版本，或你没有权限修改' };
    return { row: res.data[0] };
  }

  async function run() {
    if (!sb || !state.me) return;
    if (busyFlag) { again = true; return; }   // 正在同步：结束后马上再跑一轮
    again = false;
    if (!navigator.onLine) { st.online = false; renderSyncChip(); return; }
    busyFlag = true; st.syncing = true; st.online = true; renderSyncChip();
    try {
      const items = (await LDB.all('queue')).sort((a, b) => a.seq - b.seq);
      for (const item of items) {
        let r;
        try { r = await pushOne(item); }
        catch (e) {
          if (e.auth) { st.error = '登录已过期，请重新登录'; showLogin('登录已过期，请重新登录（未上传的数据不会丢）'); }
          else { st.error = navigator.onLine ? '网络不稳，稍后自动重试' : ''; }
          throw e;
        }
        // 传完再检查：上传期间本条又被改过，就保留新版本继续排队
        const now = await LDB.get('queue', item.k);
        const changed = now && now.rec.updatedAt !== item.rec.updatedAt;
        if (now && !changed) await LDB.del('queue', item.k);
        else if (now) await LDB.put('queue', { ...now, isNew: false, files: now.files.filter(f => !item.files.includes(f)) });
        if (r.rejected) {
          toast(`「${item.rec.name}」上传被服务器拒绝：${r.rejected}`, 6000);
          await refetch(item.table, item.id);   // 以服务器为准恢复
        } else if (!changed) {
          applyRow(item.table, r.row);
          if (item.rec.deleted && item.table === 'shops' && item.rec.photos.length) {
            sb.storage.from(PHOTO_BUCKET).remove(item.rec.photos).catch(() => {});   // 删记录顺带删照片（尽力而为）
          }
        }
      }
      await pull();
      st.error = ''; st.lastOk = Date.now();
    } catch (e) {
      st.lastErr = String(e && e.message || e);
      if (!st.error && navigator.onLine) st.error = '网络不稳，稍后自动重试';
      clearTimeout(timer); timer = setTimeout(run, 15000);   // 15 秒后重试
    } finally {
      busyFlag = false; st.syncing = false;
      await refreshCount();
      if (again) kick(100);
    }
  }

  // 拉取服务器上的变化（与上次游标重叠 10 秒，防止漏掉同一时刻提交的数据）
  async function pull() {
    for (const table of ['areas', 'shops']) {
      const cur = (await LDB.get('meta', 'cursor:' + table)) || '1970-01-01T00:00:00Z';
      const since = new Date(new Date(cur).getTime() - 10000).toISOString();
      let max = cur, from = 0;
      for (;;) {
        const { data, error } = await sb.from(table).select('*').gt('server_at', since)
          .order('server_at').order('id').range(from, from + 999);
        if (error) throw Object.assign(new Error(error.message), { net: isNetErr(error) });
        const queued = new Set((await LDB.all('queue')).map(q => q.k));
        for (const row of data) {
          if (!queued.has(table + ':' + row.id)) applyRow(table, row);
          if (row.server_at > max) max = row.server_at;
        }
        if (data.length < 1000) break;
        from += 1000;
      }
      await LDB.put('meta', max, 'cursor:' + table);
    }
    afterRemoteChange();
  }
  // 单条按服务器版本恢复（上传被拒时）
  async function refetch(table, id) {
    const { data } = await sb.from(table).select('*').eq('id', id);
    if (data && data[0]) applyRow(table, data[0]);
    else applyRow(table, { id, deleted: true });
    afterRemoteChange();
  }
  function applyRow(table, row) {
    if (table === 'shops') {
      if (row.deleted) {
        state.shops.delete(row.id); removeMarker(row.id); LDB.del('shops', row.id).catch(() => {});
        return;
      }
      const rec = fromRow(row, SHOP_COLS);
      state.shops.set(rec.id, rec); upsertMarker(rec); LDB.put('shops', rec).catch(() => {});
    } else {
      const old = state.polygons.get(row.id);
      if (old && state.map) { state.map.remove(old); state.polygons.delete(row.id); }
      if (row.deleted) { state.areas.delete(row.id); LDB.del('areas', row.id).catch(() => {}); return; }
      const a = fromRow(row, AREA_COLS);
      state.areas.set(a.id, a); drawAreaPolygon(a); LDB.put('areas', a).catch(() => {});
    }
  }
  // 别人改了数据：刷新计数和正在看的列表（不打断正在填写的表单）
  function afterRemoteChange() {
    updateCount();
    if (state.formOpen || !document.body.classList.contains('sheet-open')) return;
    if ($('#lbody')) renderList();
    else if ($('#tBody')) renderTasks();
    else if ($('#areaList')) { const y = $('#sheetBody').scrollTop; openAreas(); $('#sheetBody').scrollTop = y; }
  }

  function schedulePull() {
    clearTimeout(pullTimer);
    pullTimer = setTimeout(run, 800);
  }
  function start() {
    window.addEventListener('online', () => { st.online = true; kick(500); });
    window.addEventListener('offline', () => { st.online = false; renderSyncChip(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(300); });
    setInterval(() => { if (!document.hidden) kick(); }, 60000);   // 实时推送断了也能每分钟兜底
    try {
      sb.channel('ditui-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'shops' }, schedulePull)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'areas' }, schedulePull)
        .subscribe(s => { st.realtime = s === 'SUBSCRIBED'; renderSyncChip(); });
    } catch {}
    refreshCount();
    kick();
  }
  return { st, enqueue, kick, start, refreshCount, pull };
})();

function renderSyncChip() {
  const el = $('#syncChip'); if (!el || !state.me) return;
  const st = Sync.st;
  let c = '#12A150', t = '已同步';
  if (!st.online) { c = '#8F959E'; t = st.pending ? `离线 · 待上传 ${st.pending}` : '离线 · 可继续标点'; }
  else if (st.syncing) { c = '#2F6BFF'; t = st.pending ? `上传中 · 剩 ${st.pending}` : '同步中…'; }
  else if (st.pending) { c = '#F5A524'; t = `待上传 ${st.pending}`; }
  if (st.error && st.online) { c = '#E5484D'; t = st.pending ? `待上传 ${st.pending} · 重试中` : st.error; }
  el.style.setProperty('--c', c);
  $('span', el).textContent = t;
  el.hidden = false;
}

const isFetchFail = m => /Failed to fetch|Load failed|NetworkError|network error|fetch failed/i.test(m || '');
const NET_FAIL_MSG = '连不上服务器，请切换 Wi-Fi/流量后重试';

async function loadProfile(user) {

  }
}

/* ==================== 图片处理 ==================== */
function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('图片无法读取')); };
    img.src = url;
  });
}
// 压缩：长边 1600px，JPEG 0.82，一张约 200-400KB
async function compressPhoto(file, max = 1600, q = 0.82) {
  const img = await loadImage(file);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('图片压缩失败')), 'image/jpeg', q));
}
// 地图标点用的小缩略图（正方形居中裁切）
async function makeThumb(blob, size = 96) {
  const img = await loadImage(blob);
  const s = Math.min(img.naturalWidth, img.naturalHeight);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL('image/jpeg', 0.75);
}

async function initMap() {
  const key = CONFIG.AMAP_KEY || store.get(LS_KEYS.key);
  const sec = CONFIG.AMAP_SECURITY_CODE || store.get(LS_KEYS.sec);
  if (!key) { showSetup(); return; }
  try {
    await loadAMap(key, sec);
  } catch (e) {
    showSetup('地图加载失败：' + (e && e.message || e) + '。请检查 Key、安全密钥和网络。');
    return;
  }
  const map = state.map = new AMap.Map('map', {
    center: CHENGDU.center, zoom: 12, zooms: [9, 20], resizeEnable: true,
  });
  let ready = false;
  map.on('complete', () => { ready = true; });
  setTimeout(() => { if (!ready) toast('地图迟迟没加载出来：可能是 Key / 安全密钥不对，或网络问题', 5000); }, 12000);

  map.setLimitBounds(new AMap.Bounds(CHENGDU.sw, CHENGDU.ne));
  map.addControl(new AMap.Scale({ position: { left: '16px', bottom: '84px' } }));
  state.geocoder = new AMap.Geocoder({ city: '成都' });
  state.placeSearch = new AMap.PlaceSearch({ city: '成都', citylimit: true, pageSize: 10 });
  state.geolocation = new AMap.Geolocation({
    enableHighAccuracy: true, timeout: 10000, showButton: false,
    showMarker: true, showCircle: true, panToLocation: true, zoomToAccuracy: false,
  });
  map.addControl(state.geolocation);

  state.areaSearch = new AMap.PlaceSearch({ city: '成都', citylimit: true, pageSize: 25 });

  map.on('zoomend', syncZoomClass);
  syncZoomClass();
  map.on('click', e => {
    // 选点模式下点地图 = 把中心移过去（桌面端更顺手）
    if (state.picking) map.setCenter(e.lnglat);
    // 圈区域模式下点地图 = 加一个边界点
    else if (state.drawing) addVertex([e.lnglat.lng, e.lnglat.lat]);
  });
  state.areas.forEach(drawAreaPolygon);
  state.shops.forEach(upsertMarker);
}

// 缩得太远时简化标点：<13 级只显示名称，<11 级只显示圆点；待核实 <17 级只显示圆点
function syncZoomClass() {
  const z = state.map.getZoom();
  document.body.classList.toggle('z-mid', z < 17);
  document.body.classList.toggle('z-far', z < 13);
  document.body.classList.toggle('z-vfar', z < 11);

function markerContent(r) {
  if (isPending(r)) {
    return `<div class="mk pending" style="--c:#F5A524">
      <div class="mk-card"><b>${esc(r.name)}</b><span class="mk-tag">待核实</span></div>
      <i class="mk-tail"></i><i class="mk-dot"></i></div>`;
  }
  return `<div class="mk" style="${scaleStyle(r.scale)}">
    <div class="mk-card">${r.thumb ? `<img src="${r.thumb}" alt="">` : `<span class="mk-noimg">${ICON.cam}</span>`}<b>${esc(r.name)}</b></div>
    <i class="mk-tail"></i><i class="mk-dot"></i></div>`;
}
function upsertMarker(r) {
  if (!state.map) return;
  let m = state.markers.get(r.id);
  if (m) {
    m.setPosition([r.lng, r.lat]);
    m.setContent(markerContent(r));
    m.setzIndex(isPending(r) ? 100 : 110);
  } else {
    m = new AMap.Marker({ position: [r.lng, r.lat], content: markerContent(r), anchor: 'bottom-center', zIndex: isPending(r) ? 100 : 110 });
    m.on('click', e => {
      // 兜底：圈区域 / 选点时点到标点，当作点在地图上
      const cur = state.shops.get(r.id) || r;
      const p = e && e.lnglat ? [e.lnglat.lng, e.lnglat.lat] : [cur.lng, cur.lat];
      if (state.drawing) addVertex(p);
      else if (state.picking) state.map.setCenter(p);
      else openDetail(r.id);
    });
    state.map.add(m);
    state.markers.set(r.id, m);
  }
}
function removeMarker(id) {
  const m = state.markers.get(id);
  if (m && state.map) state.map.remove(m);
  state.markers.delete(id);
}

// 逆地理编码：取地址 + 判断是否在成都市
function regeo(pos) {
  return new Promise(res => {
    if (!state.geocoder) return res(null);
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; res(null); } }, 6000);
    state.geocoder.getAddress(pos, (status, result) => {
      if (done) return;
      done = true; clearTimeout(timer);
      if (status === 'complete' && result.regeocode) {
        const ac = result.regeocode.addressComponent || {};
        const city = String(ac.city || ac.province || '');
        res({ address: result.regeocode.formattedAddress || '', inChengdu: city.includes('成都') });
      } else res(null);
    });
  });
}

/* ==================== 搜索 ==================== */
let qTimer, qSeq = 0;
function hideResults() { $('#results').hidden = true; }
function doSearch() {
  const kw = $('#q').value.trim();
  if (!kw) { hideResults(); return; }
  const seq = ++qSeq;
  // 先搜本机已标记的
  const mine = [...state.shops.values()]
    .filter(r => r.name.includes(kw) || (r.address || '').includes(kw) || (r.phone || '').includes(kw))
    .slice(0, 5);
  if (!state.placeSearch) { renderResults(mine, [], kw, '地图未就绪'); return; }
  state.placeSearch.search(kw, (status, result) => {
    if (seq !== qSeq) return;
    const pois = status === 'complete' ? ((result.poiList && result.poiList.pois) || []) : [];
    renderResults(mine, pois, kw, status === 'error' ? '搜索出错，请检查网络 / Key' : '');
  });
}
function renderResults(mine, pois, kw, err) {
  const box = $('#results');
  state.lastPois = pois;
  let html = '';
  if (mine.length) {
    html += '<div class="res-group">已标记</div>' + mine.map(r => `
      <div class="res-item" data-shop="${esc(r.id)}">
        <div class="res-main"><b>${esc(r.name)}</b><small>${esc(r.address || '')}</small></div>
        ${isPending(r) ? '<span class="badge pend">待核实</span>' : `<span class="badge" style="${scaleStyle(r.scale)}">${scaleOf(r.scale).label}</span>`}
      </div>`).join('');
  }
  if (pois.length) {
    html += '<div class="res-group">高德地点</div>' + pois.map((p, i) => `
      <div class="res-item" data-poi="${i}">
        <div class="res-main"><b>${esc(p.name)}</b><small>${esc(poiAddr(p))}</small></div>
        <button class="chip-btn" data-mark="${i}">标这家</button>
      </div>`).join('');
  }
  if (!html) html = `<div class="res-empty">${esc(err || `成都范围内没找到「${kw}」`)}</div>`;
  box.innerHTML = html;
  box.hidden = false;
}
const poiAddr = p => [p.adname, typeof p.address === 'string' ? p.address : ''].filter(Boolean).join(' · ');
const poiPos = p => p.location ? [p.location.lng, p.location.lat] : null;

function onResultClick(e) {
  const shopEl = e.target.closest('[data-shop]');
  if (shopEl) {
    const r = state.shops.get(shopEl.dataset.shop);

      address: [p.pname, p.cityname, p.adname, typeof p.address === 'string' ? p.address : ''].filter(Boolean).join('') || p.name,
      lng: pos[0], lat: pos[1],
    });
  }
}

async function confirmPick() {

  endPick();
  const d = state.draft || {};
  openForm({ ...d, lng: pos[0], lat: pos[1], address: (info && info.address) || d.address || '' });
}

/* ==================== 定位 ==================== */
function locateMe() {
  return new Promise((res, rej) => {
    if (!state.geolocation) return rej(new Error('请先配置高德 Key'));
    state.geolocation.getCurrentPosition((status, result) => {
      if (status === 'complete' && result && result.position) {
        const p = result.position;
        state.myPos = { pos: [p.lng, p.lat], accuracy: result.accuracy || 0, at: Date.now() };
        res(state.myPos);
      } else {
        rej(new Error('定位失败：手机需通过 HTTPS 打开本页，并允许浏览器使用定位'));
      }
    });
  });
}

/* ==================== 调查区域：圈选 ==================== */
const AREA_STYLE = { strokeColor: '#FF6A3D', strokeWeight: 2, fillColor: '#FF6A3D', bubble: true };
function drawAreaPolygon(a) {
  if (!state.map) return;
  const pg = new AMap.Polygon({ ...AREA_STYLE, path: a.path, strokeOpacity: .9, fillOpacity: .06, zIndex: 10 });
  state.map.add(pg);
  state.polygons.set(a.id, pg);
}
function startDraw() {
  if (!isAdmin()) { toast('只有管理员可以圈区域'); return; }
  if (!state.map) { toast('请先配置高德 Key'); openSettings(); return; }
  closeSheet(); hideResults();
  state.drawing = { path: [], vertices: [], shape: null };
  document.body.classList.add('drawing');
  updateDrawHint();
}
function addVertex(p) {
  const d = state.drawing;
  d.path.push(p);
  const v = new AMap.Marker({ position: p, content: '<div class="vx"></div>', anchor: 'center', zIndex: 130, bubble: true });
  state.map.add(v);
  d.vertices.push(v);
  redrawShape(); updateDrawHint();
}
function undoVertex() {
  const d = state.drawing;
  if (!d.path.length) return;
  d.path.pop(); state.map.remove(d.vertices.pop());
  redrawShape(); updateDrawHint();
}
function redrawShape() {
  const d = state.drawing;
  if (d.shape) { state.map.remove(d.shape); d.shape = null; }
  if (d.path.length < 2) return;
  const opt = { ...AREA_STYLE, path: d.path, strokeStyle: 'dashed', zIndex: 120 };
  d.shape = d.path.length >= 3 ? new AMap.Polygon({ ...opt, fillOpacity: .15 }) : new AMap.Polyline(opt);
  state.map.add(d.shape);
}
function updateDrawHint() {
  const n = state.drawing.path.length;
  $('#drawHint').textContent = n < 3 ? `点击地图添加边界点（已加 ${n} 个，至少 3 个）` : `已加 ${n} 个点，可继续添加或点「完成圈选」`;
  $('#drawOk').disabled = n < 3;
  $('#drawUndo').disabled = !n;
}
function endDraw() {
  const d = state.drawing; if (!d) return;
  d.vertices.forEach(v => state.map.remove(v));
  if (d.shape) state.map.remove(d.shape);
  state.drawing = null;
  document.body.classList.remove('drawing');
}
async function finishDraw() {
  const path = state.drawing.path.map(p => [+p[0].toFixed(6), +p[1].toFixed(6)]);
  if (path.length < 3) return;
  const km2 = polygonArea(path);
  const name = prompt(`区域面积约 ${km2 < 1 ? Math.round(km2 * 1e6) + ' ㎡' : km2.toFixed(2) + ' 平方公里'}，给它起个名字：`, `区域 ${state.areas.size + 1}`);
  if (name === null) return;   // 取消命名 = 继续编辑
  const area = { id: uid(), name: name.trim().slice(0, 30) || `区域 ${state.areas.size + 1}`, path, createdAt: Date.now(), updatedAt: Date.now() };
  try { await DB.areas.put(area); } catch (e) { toast('保存区域失败：' + e.message); return; }
  endDraw();
  state.areas.set(area.id, area);
  drawAreaPolygon(area);
  openAreaSearch(area.id);
}
function fitArea(id) {
  const pg = state.polygons.get(id);
  if (pg && state.map) state.map.setFitView([pg], false, [80, 120, 40, 40]);
}

async function deleteArea(id) {

function searchPage(ps, kw, polygon, page) {
  return new Promise(res => {
    ps.setPageIndex(page);
    ps.searchInBounds(kw, polygon, (status, result) => res({ status, result }));
  });
}
async function runAreaSearch() {
  const ap = state.areaPick;
  ap.kw = $('#asKw').value.trim();
  const kw = ap.kw || ap.type;
  if (!kw) { toast('请选择商家类型或输入关键词'); return; }
  const a = state.areas.get(ap.areaId);
  const ps = state.areaSearch;
  ps.setType(ap.type);
  busy(true);
  const all = [];
  let err = '', capped = false;
  for (let page = 1; page <= AREA_PAGES; page++) {
    const { status, result } = await searchPage(ps, kw, state.polygons.get(a.id), page);
    if (status === 'error') { err = '搜索出错，请检查网络 / Key'; break; }
    if (status !== 'complete') break;   // no_data
    const pois = (result.poiList && result.poiList.pois) || [];
    all.push(...pois);
    const count = (result.poiList && result.poiList.count) || 0;
    if (pois.length < 25 || all.length >= count) break;
    if (page === AREA_PAGES) capped = true;
  }
  busy(false);
  // 二次过滤：只留真正落在多边形内、有坐标、不重复的
  const known = new Set([...state.shops.values()].map(r => r.poiId).filter(Boolean));
  const seen = new Set();
  ap.results = all.filter(p => {
    const pos = poiPos(p);
    if (!pos || !p.id || seen.has(p.id) || !inPolygon(pos, a.path)) return false;
    seen.add(p.id); return true;
  }).map(p => ({ ...p, exists: known.has(p.id) }));
  ap.checked = new Set(ap.results.filter(p => !p.exists).map(p => p.id));
  ap.capped = capped;
  renderAreaResults(err);
}
function renderAreaResults(err) {
  const ap = state.areaPick;
  const rs = ap.results;
  const ex = rs.filter(p => p.exists).length;
  $('#asRes').innerHTML = rs.length ? `
    <div class="pick-head"><span>共 ${rs.length} 家${ex ? `（${ex} 家已在图上）` : ''}</span>
      <span class="ops"><button class="mini" data-all="1">全选</button><button class="mini" data-all="0">全不选</button></span></div>
    ${ap.capped ? `<div class="banner warn">结果较多，只取了前 ${AREA_PAGES * 25} 家，可缩小区域或加关键词</div>` : ''}
    ${rs.map(p => `<label class="ck${p.exists ? ' dis' : ''}">
      <input type="checkbox" data-pid="${esc(p.id)}"${ap.checked.has(p.id) ? ' checked' : ''}${p.exists ? ' disabled' : ''}>
      <div class="ck-main"><b>${esc(p.name)}</b><small>${esc(poiAddr(p))}</small>
        <small>${esc(String(p.type || '').split(';').slice(-1)[0])}${p.exists ? ' · 已在图上' : ''}</small></div>
    </label>`).join('')}`
    : `<div class="empty">${esc(err || '区域内没搜到符合条件的商家，换个类型或关键词试试')}</div>`;
  syncAreaMake();
}
function syncAreaMake() {
  const n = state.areaPick.checked.size;
  $('#asMake').disabled = !n;
  $('#asMake').textContent = n ? `设为待核实（${n} 家）` : '设为待核实';
}
async function createPending() {
  if (!isAdmin()) return;
  const ap = state.areaPick;
  const pois = ap.results.filter(p => ap.checked.has(p.id) && !p.exists);
  if (!pois.length) return;
  const now = Date.now(), who = state.me.name;
  const recs = pois.map(p => {
    const pos = poiPos(p);
    return {
      id: uid(), status: 'pending', areaId: ap.areaId, poiId: p.id, poiType: String(p.type || ''),
      name: String(p.name).slice(0, 50),
      phone: typeof p.tel === 'string' ? p.tel.split(';')[0].slice(0, 20) : '',
      address: [p.adname, typeof p.address === 'string' ? p.address : ''].filter(Boolean).join('').slice(0, 100),
      lng: pos[0], lat: pos[1], scale: '', note: '', photos: [], thumb: '',
      recorder: '', planner: who, createdAt: now, updatedAt: now,
    };
  });
  try { await DB.shops.putMany(recs); } catch (e) { toast('保存失败：' + e.message); return; }
  recs.forEach(r => { state.shops.set(r.id, r); upsertMarker(r); });

  closeSheet();

  toast(`已生成 ${recs.length} 个「待核实」任务`);

  try {
    for (const f of list) state.draft.photos.push(await compressPhoto(f));
  } catch (e) {
    toast('有照片处理失败：' + e.message + '（iPhone 可在 设置→相机→格式 改为「兼容性最佳」）', 5000);
  }
  busy(false);
  renderPhotoGrid();
}
async function saveForm() {
  collectForm();
  const d = state.draft;
  const f = $('#shopForm');
  let bad = false;
  f.querySelectorAll('.bad').forEach(el => el.classList.remove('bad'));
  if (!d.name) { f.name.classList.add('bad'); bad = true; }
  if (!d.scale) { $('#scaleSeg').classList.add('bad'); bad = true; }
  if (d.phone && !/^[\d\-+ ()转]{5,20}$/.test(d.phone)) { f.phone.classList.add('bad'); toast('电话格式不对'); return; }
  if (bad) { toast('请补全带 * 的必填项'); return; }
  if (d.verifying && !d.photos.length) { toast('核实必须上传至少 1 张实拍照片'); return; }
  if (!d.verifying && !d.photos.length && !confirm('还没有实拍照片，确定先保存吗？')) return;

  // 核实提交前再定位一次，防止离开现场后才提交
  let check = null;
  if (d.verifying) {
    const btn = $('#saveBtn');
    btn.disabled = true; btn.textContent = '复核位置…';
    try {
      const me = await locateMe();
      check = { pos: me.pos, dist: distance(me.pos, d.verifying.origin) };
    } catch (e) { toast(e.message, 4500); }
    btn.disabled = false; btn.textContent = '保存';
    if (!check) return;
    if (check.dist > VERIFY_RADIUS) {
      alert(`你现在距离该店约 ${fmtDist(check.dist)}，超出 ${VERIFY_RADIUS} 米，请回到店铺附近再提交。`);
      return;
    }
  }

  const now = Date.now();
  const pos = [d.lng, d.lat];
  const rec = {
    id: d.id || uid(),
    status: d.verifying ? 'verified' : statusOf(d),
    name: d.name, phone: d.phone, scale: d.scale, note: d.note, address: d.address,
    lng: d.lng, lat: d.lat, photos: d.photos,
    thumb: d.photos.length ? await makeThumb(d.photos[0]) : '',
    recorder: d.verifying || !d.id ? state.me.name : (d.recorder || state.me.name),
    // 区域任务相关字段：手动标点若落在某个区域内，也自动归属该区域
    areaId: d.areaId || ([...state.areas.values()].find(a => inPolygon(pos, a.path)) || {}).id || '',
    poiId: d.poiId || '', poiType: d.poiType || '', planner: d.planner || '',
    verifiedAt: check ? now : (d.verifiedAt || 0),
    verifyDist: check ? Math.round(check.dist) : (d.verifyDist ?? null),
    verifyPos: check ? check.pos.map(v => +v.toFixed(6)) : (d.verifyPos || null),
    createdAt: d.createdAt || now, updatedAt: now,
  };
  try {
    await DB.shops.put(rec);
  } catch (e) {
    toast('保存失败：' + (e && e.message || e), 5000); return;
  }
  state.shops.set(rec.id, rec);
  upsertMarker(rec);
  if (state.searchMarker) { state.map.remove(state.searchMarker); state.searchMarker = null; }
  updateCount();
  state.draft = null; state.formOpen = false;
  closeSheet();
  toast(d.verifying ? '核实完成：' + rec.name : d.id ? '已更新' : '已标记：' + rec.name);
}

/* ==================== 导出：ZIP = Excel + 照片 + data.json ==================== */
async function exportZip() {
  if (!isAdmin()) return;
  if (!state.shops.size && !state.areas.size) { toast('还没有记录可以下载'); return; }
  if (/MicroMessenger/i.test(navigator.userAgent)) { alert('微信内置浏览器不支持下载文件，请点右上角「…」→ 在浏览器打开，再下载。'); return; }
  busy(true);
  try {
    const [JSZip, XLSX] = await Promise.all([needLib('JSZip'), needLib('XLSX')]);
    const areaName = id => (state.areas.get(id) || {}).name || '';
    // 排序：已有数据在前、待核实在后，各自按时间
    const list = [...state.shops.values()].sort((a, b) => (isPending(a) - isPending(b)) || (a.createdAt - b.createdAt));
    const zip = new JSZip();
    const dir = zip.folder('照片');
    const rows = [], meta = [];
    // 先把所有照片取到本机（已缓存的不重复下载）
    const blobs = new Map();
    const allPaths = list.flatMap(r => r.photos);
    let got = 0, miss = 0;
    for (const path of allPaths) {
      try { blobs.set(path, await getPhotoBlob(path)); } catch { miss++; }
      $('#busy div').textContent = `下载照片 ${++got}/${allPaths.length}…`;
    }
    $('#busy div').textContent = '打包中…';
    list.forEach((r, i) => {
      const no = i + 1;
      const files = r.photos.filter(p => blobs.has(p)).map(p => blobs.get(p)).map((b, j) => {
        const fn = `${pad(no, 3)}_${safeName(r.name)}_${j + 1}.jpg`;
        dir.file(fn, b);
        return '照片/' + fn;
      });
      rows.push({
        '序号': no, '状态': STATUS[statusOf(r)], '店家名称': r.name, '联系电话': r.phone || '',
        '店家规模': isPending(r) ? '' : scaleOf(r.scale).label,
        '地址': r.address || '', '经度(GCJ-02)': r.lng, '纬度(GCJ-02)': r.lat,
        '所属区域': areaName(r.areaId), '高德类型': String(r.poiType || '').replace(/;/g, '/'),
        '记录人': r.recorder || '', '记录时间': isPending(r) ? '' : fmtTime(r.verifiedAt || r.createdAt),
        '核实距离(米)': r.verifyDist ?? '', '备注': r.note || '', '照片数': files.length,
        '照片1': files[0] || '', '照片2': files[1] || '', '照片3': files[2] || '', '记录ID': r.id,
      });
      const { photos, thumb, owner, serverAt, ...rest } = r;
      meta.push({ ...rest, photos: files });
    });
    const wb = XLSX.utils.book_new();
    if (rows.length) {
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [6, 9, 24, 14, 8, 36, 12, 12, 12, 20, 10, 17, 11, 24, 7, 28, 28, 28, 14].map(w => ({ wch: w }));
      // 照片列加超链接：解压后在 Excel 里点一下就能打开图片
      const head = Object.keys(rows[0]);
      ['照片1', '照片2', '照片3'].forEach(h => {
        const c = head.indexOf(h);
        rows.forEach((row, i) => {
          const ref = XLSX.utils.encode_cell({ r: i + 1, c });
          if (row[h] && ws[ref]) ws[ref].l = { Target: row[h] };
        });
      });
      XLSX.utils.book_append_sheet(wb, ws, '地推记录');
    }
    if (state.areas.size) {
      const arows = [...state.areas.values()].map(a => {
        const s = areaStats(a.id);
        return {
          '区域名称': a.name, '面积(平方公里)': +polygonArea(a.path).toFixed(3),
          '待核实': s.pending, '已核实': s.verified, '完成率': s.total ? Math.round(s.verified / s.total * 100) + '%' : '—',
          '创建时间': fmtTime(a.createdAt), '边界坐标(GCJ-02)': a.path.map(p => p.join(',')).join(' ; '),
        };
      });
      const ws2 = XLSX.utils.json_to_sheet(arows);
      ws2['!cols'] = [16, 14, 8, 8, 8, 17, 60].map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws2, '调查区域');
    }
    const name = `地推记录_${stamp()}`;
    zip.file(`${name}.xlsx`, XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
    zip.file('data.json', JSON.stringify({
      app: 'ditui-pin', version: 2, exportedAt: Date.now(),
      areas: [...state.areas.values()], records: meta,
    }, null, 1));
    const blob = await zip.generateAsync({ type: 'blob' });
    download(blob, `${name}.zip`);
    toast(`已导出 ${list.length} 条记录、${state.areas.size} 个区域${miss ? `；${miss} 张照片下载失败，请检查网络后重试` : ''}`, miss ? 6000 : 2400);
  } catch (e) {
    toast('导出失败：' + e.message, 5000);
  } finally { busy(false); $('#busy div').textContent = '处理中…'; }
}

    const img = e.target.closest('[data-view]');
    if (img) { viewPhoto(img.src); return; }
    const li = e.target.closest('.li[data-id]');
    if (li) { const r = state.shops.get(li.dataset.id); if (r) { focusShop(r); openDetail(r.id); } }
  });
  $('#photoInput').addEventListener('change', e => { const fs = e.target.files; if (fs.length) onPhotosPicked(fs); e.target.value = ''; });
  $('#viewer').onclick = () => { $('#viewer').hidden = true; };
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#viewer').hidden) $('#viewer').hidden = true;
    else if (document.body.classList.contains('sheet-open')) tryClose();
    else if (state.picking) $('#pickCancel').click();
    else if (state.drawing) $('#drawCancel').click();
  });
}

const AUTH_KEY = 'dt-online-auth';
// 登录成功（或离线用缓存身份）后进入地图
async function enter(user) {
  try { state.me = await loadProfile(user); } catch (e) { showLogin(e.message); return; }
  // 换了账号：清掉上一个账号留在本机的缓存
  const last = await LDB.get('meta', 'uid').catch(() => null);
  if (last && last !== user.id) await LDB.clearAll().catch(() => {});
  await LDB.put('meta', user.id, 'uid').catch(() => {});
  document.body.classList.toggle('is-admin', isAdmin());
  $('#login').hidden = true;
  try {
    (await LDB.all('shops')).forEach(r => state.shops.set(r.id, r));
    (await LDB.all('areas')).forEach(a => state.areas.set(a.id, a));
  } catch (e) {
    toast('本机数据库打开失败：' + (e && e.message || e) + '（无痕模式可能无法离线保存）', 5000);
  }
  updateCount();
  renderSyncChip();
  await initMap();
  Sync.start();
}
function bindLogin() {
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = String(fd.get('email') || '').trim(), password = String(fd.get('password') || '');
    if (!email || !password) { showLogin('请填写邮箱和密码'); return; }
    if (!sb) { showLogin('组件没加载成功，请刷新页面'); return; }
    const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '登录中…';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = '登录';
    if (error) {
      showLogin(/Invalid login/i.test(error.message) ? '邮箱或密码不对'
        : !navigator.onLine ? '登录失败：当前没有网络'
        : isFetchFail(error.message) ? NET_FAIL_MSG
        : '登录失败：' + error.message);
      return;
    }
    e.target.password.value = '';
    if (state.me) {
      // 登录过期后重新登录：同一账号直接继续上传；换了账号就清掉重来
      if (data.user.id === state.me.id) { $('#login').hidden = true; Sync.st.error = ''; Sync.kick(); return; }
      await Sync.refreshCount();
      if (Sync.st.pending && !confirm(`上一个账号还有 ${Sync.st.pending} 条没上传，换账号会丢失。确定？`)) { await sb.auth.signOut({ scope: 'local' }); return; }
      await LDB.clearAll().catch(() => {});
      location.reload(); return;
    }
    await enter(data.user);
  });
}

(async function boot() {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  bindUI();
  bindLogin();
  try { await needLib('supabase'); } catch (e) {
    showLogin('组件加载失败，请检查网络后刷新页面'); return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: AUTH_KEY },
  });
  let session = null, err = null;
  try { const r = await sb.auth.getSession(); session = r.data.session; err = r.error; } catch (e) { err = e; }
  if (session) { await enter(session.user); return; }
  // 离线 / 网络差导致令牌没法续期：本机有登录记录就先用缓存身份进入，联网后自动续期
  const saved = store.get(AUTH_KEY);
  const cached = await LDB.get('meta', 'me').catch(() => null);
  if (saved && cached && (err || !navigator.onLine)) {
    toast('网络不通，先用离线模式；联网后自动上传', 4000);
    await enter({ id: cached.id, email: cached.email });
    return;
  }
  showLogin();
})();
</script>
